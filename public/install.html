<script>
// Church key from the QR link (install.html?k=KEY): store it on this device and strip it from the address bar. The "open BEST" buttons
// carry it on to the app page (needed on iPhone: Safari and the home-screen app do not share storage, so the key must be in the saved URL).
(function () {
  var u = new URL(location.href), k = (u.searchParams.get('k') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  // Also kept in a cookie: iOS 17.2+ copies Safari cookies into a newly added home-screen app (its localStorage starts empty).
  var ck = (document.cookie.match(/(?:^|; )best_key=([A-Z0-9]+)/) || [])[1] || '';
  try { if (k) localStorage.setItem('best.key', k); else { k = localStorage.getItem('best.key') || ck; if (k) localStorage.setItem('best.key', k); } } catch (e) {}
  if (k && k !== ck) document.cookie = 'best_key=' + k + '; max-age=63072000; path=/; secure; samesite=lax';
  window.BEST_KEY = k;
  if (u.searchParams.has('k')) { u.searchParams.delete('k'); history.replaceState(null, '', u.pathname + u.search + u.hash); }
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!ios) { var l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.json'; document.head.appendChild(l); }
})();
</script>

<style>
:root{--bg:#fff8f1;--paper:#fff;--ink:#3b2a22;--soft:#7d6a5f;--line:#f0e2d4;--pri:#e8743b;--pri-deep:#b5521f;--chip:#fdeee2;--warn:#c0392b;--warn-bg:#fdeaea;
  --font:"Noto Sans TC","Noto Sans KR","PingFang TC","Microsoft JhengHei","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1f1814;--paper:#2b221d;--ink:#f6ece4;--soft:#c1ad9f;--line:#3d322b;--pri:#f08a55;--pri-deep:#ffb187;--chip:#3a2c23;--warn:#ff8a7a;--warn-bg:#3e2220;color-scheme:dark}}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.top{display:flex;align-items:center;gap:10px}
.clogo{width:40px;height:40px;border-radius:11px;object-fit:contain;background:#fff;flex:none}
.mark{width:40px;height:40px;border-radius:11px;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:900}
h1{font-size:22px;margin:0;flex:1}
.lang{border:2px solid var(--pri);background:var(--paper);color:var(--pri-deep);border-radius:99px;padding:6px 14px;font:inherit;font-weight:700;min-height:40px;cursor:pointer}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px}
h2{font-size:19px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
ol{margin:0;padding-left:22px;display:grid;gap:8px}
.muted{color:var(--soft);font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:14px;background:var(--pri);color:#fff;font-weight:700;text-decoration:none;margin-top:10px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:15px}
.ill{display:block;width:100%;max-width:300px;height:auto;margin:8px 0 4px;color:var(--ink)}
ol li{padding-bottom:6px;border-bottom:1px dashed var(--line)}
ol li:last-child{border-bottom:0}
.k{display:inline-block;border:1.5px solid var(--line);border-radius:8px;padding:0 6px;background:var(--chip);font-weight:700}
</style>
</head>

x="157" y="58" width="24" height="24" rx="6" fill="#c9bfe0"/><rect x="95" y="58" width="24" height="24" rx="6" fill="#e8743b"/><text x="107" y="73" text-anchor="middle" font-size="6.5" font-weight="900" fill="#fff">BEST</text><rect x="89" y="52" width="36" height="36" rx="9" fill="none" stroke="#e8743b" stroke-width="3.5"/></svg></li></ol>

<script>
// APK download link: set after the APK is published (Firebase Spark Hosting cannot serve .apk files).
const APK_URL = 'https://github.com/dosun0691-sketch/best-app/releases/latest/download/best-app.apk';
const STR = {

    i3: '열린 BEST 화면에서, 화면 아래(또는 위)의 공유 버튼 <span class="k">⬆︎</span> 을 누릅니다.',

    a1: '아래 버튼(또는 교회 관리자가 보내 준 링크)으로 APK 파일을 내려받습니다.',
    a2: '내려받은 파일을 엽니다. 「출처를 알 수 없는 앱」 경고가 나오면 「설정」에서 이 출처 허용을 켭니다.',
    a3: '「설치」를 누릅니다.',

    apk: 'Android 앱(APK) 내려받기', apkNone: 'APK 파일은 교회 관리자에게 받으세요.',
    aAlt: 'APK 없이 쓰려면: Chrome으로 이 주소를 열고 오른쪽 위 ⋮ → 「홈 화면에 추가」를 누르세요.',
    firstTitle: '처음 열었을 때', f1: '로그인·비밀번호가 없습니다. 교회 QR코드로 연 휴대폰은 바로 모든 BEST 기록을 보고 고칠 수 있습니다.', f2: '처음 한 번 「내 이름」을 물어봅니다(선택). 비워 두면 「동역자」로 보이고, 나중에 더보기에서 바꿀 수 있습니다.',

    svAddHome: '홈 화면에 추가', svCancel: '취소', svAdd: '추가', svAllow: '이 출처 허용', svInstall: '설치', svAppName: 'BEST 돌봄',
  },

    intro: '這是教會同工專用的 App。不需要登入或密碼，用教會 QR 碼開啟過的手機就能直接使用。安裝到主畫面後，就能像 App 一樣開啟。',
    i1: '用 iPhone 相機掃描教會的 QR 碼，用 Safari 開啟這個頁面。（如果是在 LINE 等其他 App 裡開啟，請點「用 Safari 開啟」。）',
    i2: '點下面的「開啟 BEST」按鈕，會開啟 BEST 首頁。', openApp: '開啟 BEST',
    i3: '在開啟的 BEST 畫面，點畫面下方（或上方）的分享按鈕 <span class="k">⬆︎</span>。',
    i4: '往下滑，點「加入主畫面」。',
    i5: '確認名稱是「BEST」，再點右上角「新增」。',
    i6: '點主畫面上的 BEST 圖示開啟。不需要登入就能直接使用。',
    iNote: 'App Store 上沒有這個 App。請一定要在「開啟 BEST」打開的畫面加入主畫面。如果點圖示後出現「請用教會的 QR 碼開啟」，請刪除那個圖示，重新掃描 QR 碼，從第 1 步再做一次。',
    a1: '用下面的按鈕（或教會管理者傳給您的連結）下載 APK 檔案。',
    a2: '開啟下載的檔案。如果出現「不明來源的應用程式」警告，請到「設定」允許此來源。',
    a3: '點「安裝」。',
    a4: '在 App 列表中點「BEST 關懷」開啟。如果 App 顯示「請用教會的 QR 碼開啟」，請用相機再掃描一次教會的 QR 碼——會直接在已安裝的 App 中開啟。',
    apk: '下載 Android App（APK）', apkNone: 'APK 檔案請向教會管理者索取。',
    aAlt: '不想安裝 APK：用 Chrome 開啟這個網址，點右上角 ⋮ →「加到主畫面」。',
    firstTitle: '第一次開啟時', f1: '不需要登入或密碼。用教會 QR 碼開啟過的手機，就能查看和修改所有 BEST 紀錄。', f2: '第一次會詢問「我的名字」（可不填）。不填就顯示「同工」，之後可以在「更多」修改。',

    svAddHome: '加入主畫面', svCancel: '取消', svAdd: '新增', svAllow: '允許來自這個來源', svInstall: '安裝', svAppName: 'BEST 關懷',
  },
};
let lang = localStorage.getItem('best.lang') || ((navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'ko');
function render() {
  const s = STR[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant-TW' : 'ko';
  document.title = s.title;
  document.getElementById('langBtn').textContent = s.langBtn;
  document.querySelectorAll('[data-t]').forEach((el) => { if (el instanceof SVGElement) el.textContent = s[el.dataset.t]; else el.innerHTML = s[el.dataset.t]; });   // static strings only (no user data)
  const apk = document.getElementById('apkBtn');
  apk.hidden = !APK_URL; if (APK_URL) apk.href = APK_URL;
  document.getElementById('apkNone').hidden = !!APK_URL;
  const appUrl = './' + (window.BEST_KEY ? '?k=' + encodeURIComponent(window.BEST_KEY) : '');   // iPhone: the saved home-screen URL must carry the key
  document.getElementById('openApp').href = appUrl; document.getElementById('back').href = appUrl;
}
document.getElementById('langBtn').onclick = () => { lang = lang === 'ko' ? 'zh' : 'ko'; localStorage.setItem('best.lang', lang); render(); };
render();
</script>
