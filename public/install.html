<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BEST</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E8743B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BEST">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#fff8f1;--paper:#fff;--ink:#3b2a22;--soft:#7d6a5f;--line:#f0e2d4;--pri:#e8743b;--pri-deep:#b5521f;--chip:#fdeee2;--warn:#c0392b;--warn-bg:#fdeaea;
  --font:"Noto Sans TC","Noto Sans KR","PingFang TC","Microsoft JhengHei","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1f1814;--paper:#2b221d;--ink:#f6ece4;--soft:#c1ad9f;--line:#3d322b;--pri:#f08a55;--pri-deep:#ffb187;--chip:#3a2c23;--warn:#ff8a7a;--warn-bg:#3e2220;color-scheme:dark}}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.top{display:flex;align-items:center;gap:10px}
.mark{width:40px;height:40px;border-radius:11px;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:900}
h1{font-size:22px;margin:0;flex:1}
.lang{border:2px solid var(--pri);background:var(--paper);color:var(--pri-deep);border-radius:99px;padding:6px 14px;font:inherit;font-weight:700;min-height:40px;cursor:pointer}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px}
h2{font-size:19px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
ol{margin:0;padding-left:22px;display:grid;gap:8px}
.muted{color:var(--soft);font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:14px;background:var(--pri);color:#fff;font-weight:700;text-decoration:none;margin-top:10px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:15px}
.ill{display:block;width:100%;max-width:300px;height:auto;margin:8px 0 4px;color:var(--ink)}
ol li{padding-bottom:6px;border-bottom:1px dashed var(--line)}
ol li:last-child{border-bottom:0}
.k{display:inline-block;border:1.5px solid var(--line);border-radius:8px;padding:0 6px;background:var(--chip);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="mark">BEST</span><h1 data-t="title"></h1><button class="lang" id="langBtn"></button></div>
  <p class="muted" data-t="intro"></p>
  <div class="card" id="ios">

="176" height="28" rx="6" fill="#fff"/><rect x="40" y="50" width="16" height="16" rx="3" fill="none" stroke="#3b2a22" stroke-width="2"/><path d="M48 54 V62 M44 58 H52" stroke="#3b2a22" stroke-width="2"/><text x="64" y="63" font-size="14" fill="#3b2a22" data-t="svAddHome"></text><rect x="28" y="40" width="184" height="36" rx="9" fill="none" stroke="#e8743b" stroke-width="3.5"/><rect x="32" y="78" width="176" height="20" rx="6" fill="#fff"/><rect x="40" y="85" width="70" height="6" rx="3" fill="#d1d1d6"/></svg></li><li><span data-t="i4"></span><svg class="ill" viewBox="0 0 240 110" role="img" aria-hidden="true"><rect x="10" y="20" width="220" height="70" rx="12" fill="#f2f2f7" stroke="#d1d1d6"/><text x="26" y="44" font-size="14" fill="#1e6fd9" data-t="svCancel"></text><text x="120" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#3b2a22" data-t="svAddHome"></text><text x="214" y="44" text-anchor="end" font-size="15" font-weight="700" fill="#1e6fd9" data-t="svAdd"></text><rect x="170" y="26" width="52" height="26" rx="8" fill="none" stroke="#e8743b" stroke-width="3.5"/><rect x="26" y="58" width="28" height="28" rx="7" fill="#e8743b"/><text x="40" y="76" text-anchor="middle" font-size="8" font-weight="900" fill="#fff">BEST</text><text x="64" y="77" font-size="14" fill="#3b2a22">BEST</text></svg></li><li><span data-t="i5"></span><svg class="ill" viewBox="0 0 240 110" role="img" aria-hidden="true"><rect x="50" y="4" width="140" height="102" rx="16" fill="#e9e3f5"/><rect x="64" y="16" width="24" height="24" rx="6" fill="#c9bfe0"/><rect x="64" y="58" width="24" height="24" rx="6" fill="#c9bfe0"/><rect x="95" y="16" width="24" height="24" rx="6" fill="#c9bfe0"/><rect x="126" y="16" width="24" height="24" rx="6" fill="#c9bfe0"/><rect x="126" y="58" width="24" height="24" rx="6" fill="#c9bfe0"/><rect x="157" y="16" width="24" height="24" rx="6" fill="#c9bfe0"/><rect x="157" y="58" width="24" height="24" rx="6" fill="#c9bfe0"/><rect x="95" y="58" width="24" height="24" rx="6" fill="#e8743b"/><text x="107" y="73" text-anchor="middle" font-size="6.5" font-weight="900" fill="#fff">BEST</text><rect x="89" y="52" width="36" height="36" rx="9" fill="none" stroke="#e8743b" stroke-width="3.5"/></svg></li></ol>
    <p class="note" data-t="iNote"></p>
  </div>
  <div class="card" id="android">
    <h2>🤖 Android</h2>
    <ol><li><span data-t="a1"></span><svg class="ill" viewBox="0 0 240 110" role="img" aria-hidden="true"><rect x="40" y="30" width="160" height="48" rx="14" fill="#e8743b"/><path d="M76 42 V60 M68 53 L76 61 L84 53 M66 66 H86" stroke="#fff" stroke-width="3" fill="none"/><text x="140" y="60" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">APK</text></svg></li><li><span data-t="a2"></span><svg class="ill" viewBox="0 0 240 110" role="img" aria-hidden="true"><rect x="10" y="26" width="220" height="56" rx="12" fill="#f1f3f4" stroke="#dadce0"/><text x="24" y="59" font-size="14" fill="#202124" data-t="svAllow"></text><rect x="176" y="42" width="40" height="22" rx="11" fill="#1a73e8"/><circle cx="205" cy="53" r="8" fill="#fff"/><rect x="170" y="36" width="52" height="34" rx="14" fill="none" stroke="#e8743b" stroke-width="3.5"/></svg></li><li><span data-t="a3"></span><svg class="ill" viewBox="0 0 240 110" role="img" aria-hidden="true"><rect x="30" y="8" width="180" height="94" rx="14" fill="#f1f3f4" stroke="#dadce0"/><rect x="48" y="20" width="26" height="26" rx="7" fill="#e8743b"/><text x="61" y="36" text-anchor="middle" font-size="7" font-weight="900" fill="#fff">BEST</text><text x="82" y="38" font-size="14" font-weight="700" fill="#202124" data-t="svAppName"></text><text x="196" y="86" text-anchor="end" font-size="15" font-weight="700" fill="#1a73e8" data-t="svInstall"></text><rect x="138" y="68" width="66" height="28" rx="8" fill="none" stroke="#e8743b" stroke-width="3.5"/></svg></li><li><span data-t="a4"></span><svg class="ill" viewBox="0 0 240 110" role="img" aria-hidden="true"><rect x="94" y="10" width="52" height="52" rx="14" fill="#e8743b"/><text x="120" y="41" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">BEST</text><text x="120" y="88" text-anchor="middle" font-size="14" fill="currentColor" data-t="svAppName"></text></svg></li></ol>
    <a class="btn" id="apkBtn" hidden data-t="apk"></a>
    <p class="note" id="apkNone" data-t="apkNone"></p>
    <p class="muted" data-t="aAlt"></p>
  </div>
  <div class="card"><h2 data-t="firstTitle"></h2><ol><li data-t="f1"></li><li data-t="f2"></li><li data-t="f3"></li></ol></div>
  <a class="btn ghost" href="./" data-t="back"></a>
</div>
<script>
// APK download link: set after the APK is published (Firebase Spark Hosting cannot serve .apk files).
const APK_URL = 'https://github.com/dosun0691-sketch/best-app/releases/latest/download/best-app.apk';
const STR = {
  ko: {
    langBtn: '中文', title: 'BEST 돌봄 설치 방법', back: '← BEST 돌봄 열기',
    intro: '교회 섬김이용 앱입니다. 휴대폰 홈 화면에 설치해 두면 앱처럼 바로 열립니다.',
    i1: '이 페이지를 꼭 Safari로 여세요. (LINE 등 다른 앱 안에서 열었다면 「Safari로 열기」를 누르세요.)',
    i2: '화면 아래(또는 위)의 공유 버튼 <span class="k">⬆︎</span> 을 누릅니다.',
    i3: '메뉴를 내려 「홈 화면에 추가」를 누릅니다.',
    i4: '이름이 「BEST」인지 확인하고 오른쪽 위 「추가」를 누릅니다.',
    i5: '홈 화면에 생긴 BEST 아이콘을 눌러 엽니다.',
    iNote: 'App Store에는 없습니다. 위 방법으로 설치한 아이콘에서 열어야 로그인이 유지됩니다.',
    a1: '아래 버튼(또는 교회 관리자가 보내 준 링크)으로 APK 파일을 내려받습니다.',
    a2: '내려받은 파일을 엽니다. 「출처를 알 수 없는 앱」 경고가 나오면 「설정」에서 이 출처 허용을 켭니다.',
    a3: '「설치」를 누릅니다.',
    a4: '앱 목록의 「BEST 돌봄」을 눌러 엽니다.',
    apk: 'Android 앱(APK) 내려받기', apkNone: 'APK 파일은 교회 관리자에게 받으세요.',
    aAlt: 'APK 없이 쓰려면: Chrome으로 이 주소를 열고 오른쪽 위 ⋮ → 「홈 화면에 추가」를 누르세요.',
    firstTitle: '처음 열었을 때', f1: '「Google 계정으로 로그인」을 누릅니다.', f2: '처음 한 번만 교회 초대 코드(8자리)를 넣습니다. 코드는 목사님이나 관리자에게 받으세요.',
    f3: '내 이름을 확인하고 「시작하기」를 누르면 끝입니다.',
    svAddHome: '홈 화면에 추가', svCancel: '취소', svAdd: '추가', svAllow: '이 출처 허용', svInstall: '설치', svAppName: 'BEST 돌봄',
  },
  zh: {
    langBtn: '한국어', title: 'BEST 關懷 安裝方法', back: '← 開啟 BEST 關懷',
    intro: '這是教會同工專用的 App。安裝到手機主畫面後，就能像 App 一樣直接開啟。',
    i1: '請一定要用 Safari 開啟這個頁面。（如果是在 LINE 等其他 App 裡開啟，請點「用 Safari 開啟」。）',
    i2: '點畫面下方（或上方）的分享按鈕 <span class="k">⬆︎</span>。',
    i3: '往下滑，點「加入主畫面」。',
    i4: '確認名稱是「BEST」，再點右上角「新增」。',
    i5: '點主畫面上的 BEST 圖示開啟。',
    iNote: 'App Store 上沒有這個 App。請用上面的方法安裝，並從主畫面圖示開啟，才能保持登入。',
    a1: '用下面的按鈕（或教會管理者傳給您的連結）下載 APK 檔案。',
    a2: '開啟下載的檔案。如果出現「不明來源的應用程式」警告，請到「設定」允許此來源。',
    a3: '點「安裝」。',
    a4: '在 App 列表中點「BEST 關懷」開啟。',
    apk: '下載 Android App（APK）', apkNone: 'APK 檔案請向教會管理者索取。',
    aAlt: '不想安裝 APK：用 Chrome 開啟這個網址，點右上角 ⋮ →「加到主畫面」。',
    firstTitle: '第一次開啟時', f1: '點「用 Google 帳號登入」。', f2: '只有第一次需要輸入教會邀請碼（8 位）。邀請碼請向牧師或管理者索取。',
    f3: '確認自己的名字，點「開始使用」就完成了。',
    svAddHome: '加入主畫面', svCancel: '取消', svAdd: '新增', svAllow: '允許來自這個來源', svInstall: '安裝', svAppName: 'BEST 關懷',
  },
};
let lang = localStorage.getItem('best.lang') || ((navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'ko');
function render() {
  const s = STR[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant-TW' : 'ko';
  document.title = s.title;
  document.getElementById('langBtn').textContent = s.langBtn;
  document.querySelectorAll('[data-t]').forEach((el) => { if (el instanceof SVGElement) el.textContent = s[el.dataset.t]; else el.innerHTML = s[el.dataset.t]; });   // static strings only (no user data)
  const apk = document.getElementById('apkBtn');
  apk.hidden = !APK_URL; if (APK_URL) apk.href = APK_URL;
  document.getElementById('apkNone').hidden = !!APK_URL;
}
document.getElementById('langBtn').onclick = () => { lang = lang === 'ko' ? 'zh' : 'ko'; localStorage.setItem('best.lang', lang); render(); };
render();
</script>
</body>
</html>
