<meta name="theme-color" content="#E8743B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">

<style>
:root{
  --bg:#fff8f1; --paper:#fff; --ink:#3b2a22; --soft:#7d6a5f; --line:#f0e2d4;
  --pri:#e8743b; --pri-deep:#b5521f; --pri-ink:#fff; --sun:#ffd27a; --ok:#3c8c5a; --ok-bg:#e3f4e8; --warn:#c0392b; --warn-bg:#fdeaea;
  --chip:#fdeee2; --shadow:0 2px 10px rgba(120,70,40,.08);
  --font:"Noto Sans TC","Noto Sans KR","PingFang TC","Microsoft JhengHei","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1f1814; --paper:#2b221d; --ink:#f6ece4; --soft:#c1ad9f; --line:#3d322b;
  --pri:#f08a55; --pri-deep:#ffb187; --pri-ink:#1f1814; --ok:#7fd39b; --ok-bg:#1f3a29; --warn:#ff8a7a; --warn-bg:#3e2220;
  --chip:#3a2c23; --shadow:none; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:21px;letter-spacing:.3px}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:900;letter-spacing:.5px}
.top .sp{flex:1}
.back{border:0;background:var(--chip);border-radius:12px;min-width:48px;height:44px;font-size:22px;cursor:pointer}
.lang{border:2px solid var(--pri);background:var(--paper);color:var(--pri-deep);border-radius:99px;padding:6px 14px;font-weight:700;cursor:pointer;min-height:40px}
main{padding:14px 16px;display:grid;gap:14px}
h2{font-size:19px;margin:6px 0 0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.muted{color:var(--soft);font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:0 18px;border-radius:14px;border:0;
  background:var(--pri);color:var(--pri-ink);font-weight:700;cursor:pointer;text-decoration:none}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.warn{background:var(--warn-bg);color:var(--warn)}
.btn.small{min-height:40px;padding:0 12px;font-size:15px;border-radius:11px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:grid;gap:4px;font-size:15px;color:var(--soft);font-weight:600}
input.i,select.i,textarea.i{width:100%;min-height:50px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;font-size:17px;color:var(--ink)}
textarea.i{min-height:84px;resize:vertical}
input.i:focus,select.i:focus,textarea.i:focus{outline:3px solid color-mix(in srgb,var(--pri) 35%,transparent);border-color:var(--pri)}
.req{color:var(--warn)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--pri-deep);line-height:1.2}
.stat span{font-size:13px;color:var(--soft)}
.stages{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:3px 10px;background:var(--chip);font-size:14px;font-weight:600;white-space:nowrap}
.chip.s-first{background:#ffe3cf;color:#8a3a10}.chip.s-welcome{background:#ffefc2;color:#6d5200}.chip.s-revisit{background:#e2f0ff;color:#1d4f86}
.chip.s-class{background:#ece3ff;color:#4b2a8a}.chip.s-group{background:#dff3ea;color:#1f6b45}.chip.s-settled{background:#d5efd9;color:#165a2a}
.chip.s-paused,.chip.s-unreachable{background:#ececec;color:#555}
@media (prefers-color-scheme:dark){.chip[class*=" s-"]{background:var(--chip);color:var(--ink)}}
.alert{border-left:5px solid var(--pri)}
.alert.red{border-left-color:var(--warn)}
.alert h3{margin:0 0 6px;font-size:17px}
.item{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer;min-height:64px}
.item:first-of-type{border-top:0}
.ava{width:46px;height:46px;border-radius:50%;flex:none;background:var(--chip);display:grid;place-items:center;font-weight:800;color:var(--pri-deep);overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
.item .t{flex:1;min-width:0}
.item .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .d{font-size:14px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:13px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--warn-bg);color:var(--warn);white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.empty{color:var(--soft);font-size:15px;padding:6px 0}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs a{display:grid;place-items:center;gap:0;min-height:62px;text-decoration:none;color:var(--soft);font-size:13px;font-weight:700}
nav.tabs a .ic{font-size:22px;line-height:1}
nav.tabs a.on{color:var(--pri-deep)}
.fab{position:fixed;right:max(16px,calc(50vw - 264px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;border-radius:99px;box-shadow:0 6px 18px rgba(180,80,30,.35);min-height:56px;padding:0 20px;font-size:17px}
.inner .fab{display:none}
/* detail */
.hero{display:flex;gap:14px;align-items:center}
.hero .ava{width:84px;height:84px;font-size:30px}
.hero .nm{font-size:24px;font-weight:800}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:16px}
.kv dt{color:var(--soft);font-size:14px;padding-top:2px}
.kv dd{margin:0;white-space:pre-wrap;word-break:break-word}
.pipe{display:grid;gap:6px}
.pipe button{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);text-align:left;padding:0 12px;cursor:pointer;display:flex;align-items:center;gap:8px}
.pipe button.on{border-color:var(--pri);background:var(--chip);font-weight:800}
.pipe button .num{width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:13px;font-weight:800}
.pipe button.on .num{background:var(--pri);color:#fff}
.weeks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.weeks label{display:grid;place-items:center;gap:2px;min-height:58px;border:1.5px solid var(--line);border-radius:12px;font-size:14px;cursor:pointer}
.weeks input{width:22px;height:22px;accent-color:var(--pri)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{display:grid;place-items:center;width:40px;height:44px;border-radius:10px;background:var(--chip);font-size:11px;color:var(--soft)}
.dot b{font-size:16px}
.dot.y{background:var(--ok-bg);color:var(--ok)}
.log{border-top:1px solid var(--line);padding:10px 0}
.log:first-child{border-top:0}
.log .h{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--soft);flex-wrap:wrap}
.log p{margin:4px 0;white-space:pre-wrap;word-break:break-word}
.att{display:grid;gap:8px}
.att button{display:flex;align-items:center;gap:12px;min-height:60px;border-radius:14px;border:2px solid var(--line);background:var(--paper);padding:6px 12px;text-align:left;cursor:pointer}
.att button.y{border-color:var(--ok);background:var(--ok-bg)}
.att .ck{margin-left:auto;font-size:24px;width:32px;text-align:center}
.photo-pick{display:flex;gap:12px;align-items:center}
.photo-pick .ava{width:72px;height:72px}
.center{min-height:70vh;display:grid;place-items:center;text-align:center;padding:24px}
.center .big{width:110px;height:110px;border-radius:30px;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:32px;font-weight:900;margin:0 auto 14px;letter-spacing:1px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2b221d;color:#fff;padding:10px 18px;border-radius:12px;z-index:20;font-size:15px;max-width:90vw}
.search{display:grid;gap:8px}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.seg button{flex:none;min-height:40px;border-radius:99px;border:1.5px solid var(--line);background:var(--paper);padding:0 12px;cursor:pointer;font-size:15px}
.seg button.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);font-weight:700}
</style>

const careName = (uid) => (staff.get(uid) || {}).name || '';
function absentStreak(b) {
  let n = 0;
  for (const a of attendance) {   // newest first
    if (b.firstVisit && a.id <= b.firstVisit) break;
    if (a.ids.has(b.id)) break;
    n++;
  }
  return n;
}
function dashboard() {
  const td = today(), arr = [...bests.values()];
  const noContact = arr.filter((b) => !b.lastContact && CARE_STAGES.includes(b.stage) && b.stage !== 'unreachable')
    .sort((a, b) => (a.firstVisit || '').localeCompare(b.firstVisit || ''));
  const absent = arr.filter((b) => CARE_STAGES.includes(b.stage)).map((b) => [b, absentStreak(b)]).filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1]);
  const due = arr.filter((b) => b.nextAction && b.nextDue && b.nextDue <= td).sort((a, b) => a.nextDue.localeCompare(b.nextDue));
  const month = td.slice(0, 7);
  const newMonth = arr.filter((b) => (b.firstVisit || '').startsWith(month)).length;
  const active = arr.filter((b) => CARE_STAGES.includes(b.stage)).length;
  const recent4 = attendance.slice(0, 4);
  const cohort = arr.filter((b) => b.firstVisit && daysBetween(b.firstVisit, td) >= 56);
  const kept = cohort.filter((b) => ['group', 'settled'].includes(b.stage) || recent4.some((a) => a.ids.has(b.id)));
  const counts = Object.fromEntries(ALL_STAGES.map((s) => [s, arr.filter((b) => b.stage === s).length]));
  return { noContact, absent, due, newMonth, active, cohort: cohort.length, kept: kept.length, counts };
}

      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let q = 0.8, out = c.toDataURL('image/jpeg', q);
      while (out.length > 280000 && q > 0.3) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
      res(out);
    };
    img.onerror = rej; img.src = url;
  });
}
function bindForm(b) {
  $('#f_photo').onchange = async (e) => { const f = e.target.files[0]; if (!f) return; try { formPhoto = await resizePhoto(f); $('#phPrev').innerHTML = ava({ photo: formPhoto }); $('#phDel').hidden = false; } catch (er) { onErr(er); } };
  $('#phDel').onclick = () => { formPhoto = ''; $('#phPrev').innerHTML = ava({ name: $('#f_name').value }); $('#phDel').hidden = true; };
  $('#fCancel').onclick = () => history.back();
  if ($('#fDel')) $('#fDel').onclick = async () => {
    if (!confirm(t('delAsk'))) return;
    try {
      const logs = await getDocs(collection(db, 'bests', b.id, 'logs'));
      const batch = writeBatch(db); logs.docs.forEach((d) => batch.delete(d.ref)); batch.delete(doc(db, 'bests', b.id)); await batch.commit();
      location.hash = '#list';
    } catch (e) { onErr(e); }
  };
  $('#fSave').onclick = async () => {
    const val = (k) => $('#f_' + k).value.trim();
    const data = { name: val('name'), photo: formPhoto || '', gender: val('gender'), age: val('age'), phone: val('phone'), line: val('line'), area: val('area'),
      firstVisit: val('firstVisit'), invitedBy: val('invitedBy'), faith: val('faith'), caretaker: val('caretaker'), family: val('family'), prayer: val('prayer'), memo: val('memo'),
      updatedAt: serverTimestamp(), updatedBy: me.uid };
    if (!data.name) return toast(t('needName'));
    $('#fSave').disabled = true;
    try {
      if (b) { await updateDoc(doc(db, 'bests', b.id), data); history.back(); }
      else {
        Object.assign(data, { stage: 'first', stageHistory: [{ s: 'first', d: data.firstVisit || today(), by: me.uid }], cls: [false, false, false, false, false],
          lastContact: '', nextAction: '', nextDue: '', createdAt: serverTimestamp(), createdBy: me.uid });
        const ref = await addDoc(collection(db, 'bests'), data);
        location.replace('#best/' + ref.id);
      }
      toast(t('saved'));
    } catch (e) { $('#fSave').disabled = false; onErr(e); }

}

/* ---------- detail ---------- */

    '<div class="row" style="margin-top:12px">' + (b.phone ? '<a class="btn small" href="tel:' + esc(b.phone.replace(/[^0-9+]/g, '')) + '">📞 ' + esc(t('call')) + '</a>' : '') +

    kv('family', esc(b.family)) + kv('prayer', esc(b.prayer)) + kv('memo', esc(b.memo)) + '</dl></div>';
  h += '<div class="card"><label class="f">' + esc(t('caretaker')) + '<select class="i" id="careSel"><option value="">' + esc(t('none')) + '</option>' +
    staffArr.map((s) => '<option value="' + esc(s.id) + '"' + (b.caretaker === s.id ? ' selected' : '') + '>' + esc(s.name) + '</option>').join('') + '</select></label></div>';
  h += '<div class="card"><h3 style="margin:0 0 8px;font-size:17px">' + esc(t('moveTo')) + '</h3><div class="pipe">' +
    MAIN_STAGES.map((s, i) => '<button data-st="' + s + '" class="' + (b.stage === s ? 'on' : '') + '"><span class="num">' + (i + 1) + '</span>' + esc(t('s_' + s)) + '</button>').join('') +
    '</div><p class="muted" style="margin:10px 0 4px">' + esc(t('sideStates')) + '</p><div class="pipe" style="grid-template-columns:1fr 1fr">' +
    SIDE_STAGES.map((s) => '<button data-st="' + s + '" class="' + (b.stage === s ? 'on' : '') + '">' + esc(t('s_' + s)) + '</button>').join('') + '</div>' +
    '<details style="margin-top:10px"><summary class="muted">' + esc(t('stageHist')) + '</summary><ul style="margin:6px 0;padding-left:18px">' +
    (b.stageHistory || []).slice().reverse().map((x) => '<li>' + esc(x.d) + ' · ' + esc(t('s_' + x.s)) + (x.by ? ' <span class="muted">(' + esc(careName(x.by)) + ')</span>' : '') + '</li>').join('') + '</ul></details></div>';
  const cls = b.cls || [false, false, false, false, false];
  h += '<div class="card"><h3 style="margin:0 0 8px;font-size:17px">' + esc(t('clsTitle')) + ' · ' + cls.filter(Boolean).length + '/5</h3><div class="weeks">' +
    cls.map((c, i) => '<label><input type="checkbox" data-wk="' + i + '"' + (c ? ' checked' : '') + '>' + esc(t('week', { n: i + 1 })) + '</label>').join('') + '</div></div>';
  const sundays = attendance.filter((a) => !b.firstVisit || a.id >= b.firstVisit).slice(0, 8).reverse();
  h += '<div class="card"><h3 style="margin:0 0 8px;font-size:17px">' + esc(t('attHist')) + '</h3>' + (sundays.length ? '<div class="dots">' +
    sundays.map((a) => { const y = a.ids.has(b.id); return '<span class="dot' + (y ? ' y' : '') + '"><b>' + (y ? '●' : '○') + '</b>' + esc(fmtDate(a.id)) + '</span>'; }).join('') + '</div>' : '<p class="empty">' + esc(t('attNone')) + '</p>') + '</div>';
  h += '<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0;font-size:17px">' + esc(t('logs')) + '</h3><button class="btn small" id="addLogBtn">' + esc(t('addLog')) + '</button></div>' +
    '<div id="logForm" hidden style="display:grid;gap:10px;margin-top:10px"><div class="grid2"><label class="f">' + esc(t('logDate')) + '<input class="i" type="date" id="l_date" value="' + td + '"></label>' +
    '<label class="f">' + esc(t('method')) + '<select class="i" id="l_method">' + METHODS.map((m) => '<option value="' + m + '">' + esc(t('m_' + m)) + '</option>').join('') + '</select></label></div>' +
    '<label class="f">' + esc(t('content')) + '<textarea class="i" id="l_content" maxlength="2000"></textarea></label>' +
    '<label class="f">' + esc(t('prayer')) + '<textarea class="i" id="l_prayer" maxlength="2000"></textarea></label>' +
    '<div class="grid2"><label class="f">' + esc(t('next')) + '<input class="i" id="l_next" maxlength="300"></label><label class="f">' + esc(t('due')) + '<input class="i" type="date" id="l_due"></label></div>' +
    '<button class="btn wide" id="l_save">' + esc(t('save')) + '</button></div>' +
    '<div id="logList" style="margin-top:8px">' + logsHtml(b) + '</div></div>';
  return h;
}
function logsHtml(b) {
  const L = logsCache.filter((l) => l._b === b.id);
  if (!L.length) return '<p class="empty">' + esc(t('noLogs')) + '</p>';
  return L.map((l) => '<div class="log"><div class="h"><b style="color:var(--ink)">' + esc(l.date) + '</b><span class="chip">' + esc(t('m_' + l.method)) + '</span><span>' + esc(careName(l.by)) + '</span></div>' +
    (l.content ? '<p>' + esc(l.content) + '</p>' : '') + (l.prayer ? '<p>🙏 ' + esc(l.prayer) + '</p>' : '') +
    (l.next ? '<p class="muted">→ ' + esc(l.next) + (l.due ? ' (' + esc(l.due) + ')' : '') + '</p>' : '') + '</div>').join('');
}
let logFor = null;
function bindDetail(b) {
  if (logFor !== b.id) {
    if (logUnsub) logUnsub(); logFor = b.id; logsCache = [];
    logUnsub = onSnapshot(query(collection(db, 'bests', b.id, 'logs'), orderBy('date', 'desc'), limit(200)), (qs) => {
      logsCache = qs.docs.map((d) => ({ id: d.id, _b: b.id, ...d.data() }));
      const el = $('#logList'); if (el && route().id === b.id) el.innerHTML = logsHtml(b);
    }, onErr);
  }
  if ($('#cpLine')) $('#cpLine').onclick = async () => { try { await navigator.clipboard.writeText(b.line); toast(t('copied')); } catch (e) { prompt(t('line'), b.line); } };
  const upd = (data) => updateDoc(doc(db, 'bests', b.id), { ...data, updatedAt: serverTimestamp(), updatedBy: me.uid }).catch(onErr);
  $('#careSel').onchange = (e) => { e.target.blur(); upd({ caretaker: e.target.value }).then(() => toast(t('saved'))); };
  document.querySelectorAll('[data-st]').forEach((el) => el.onclick = () => {
    const s = el.dataset.st; if (s === b.stage) return;
    upd({ stage: s, stageHistory: [...(b.stageHistory || []), { s, d: today(), by: me.uid }].slice(-200) });
  });
  document.querySelectorAll('[data-wk]').forEach((el) => el.onchange = () => {
    const cls = (b.cls || [false, false, false, false, false]).slice(); cls[+el.dataset.wk] = el.checked; upd({ cls });
  });
  $('#addLogBtn').onclick = () => { const f = $('#logForm'); f.hidden = !f.hidden; if (!f.hidden) $('#l_content').focus(); };

    $('#l_save').disabled = true;
    try {
      await addDoc(collection(db, 'bests', b.id, 'logs'), log);
      const patch = {};
      if (!b.lastContact || log.date > b.lastContact) patch.lastContact = log.date;
      if (log.next) { patch.nextAction = log.next; patch.nextDue = log.due || log.date; }
      if (Object.keys(patch).length) await upd(patch);
      toast(t('saved'));
      render();
    } catch (e) { $('#l_save').disabled = false; onErr(e); }
  };
}

/* ---------- attendance ---------- */
function viewAtt() {
  const rec = attendance.find((a) => a.id === attDay);
  const ids = rec ? rec.ids : new Set();
  const arr = [...bests.values()].filter((b) => b.stage !== 'paused' || ids.has(b.id)).sort((a, b) => a.name.localeCompare(b.name));
  return '<h2>' + esc(t('attTitle')) + '</h2><p class="muted" style="margin:0">' + esc(t('attSub')) + '</p>' +
    '<div class="row"><label class="f" style="flex:1">' + esc(t('attDay')) + '<input class="i" type="date" id="attDay" value="' + attDay + '"></label>' +
    '<span class="chip" style="align-self:end;min-height:40px;font-size:16px">' + esc(t('present', { n: [...ids].filter((i) => bests.has(i)).length })) + '</span></div>' +
    '<div class="att">' + (arr.length ? arr.map((b) => { const y = ids.has(b.id); return '<button data-att="' + esc(b.id) + '" class="' + (y ? 'y' : '') + '">' + ava(b) +
      '<span><b>' + esc(b.name) + '</b><br><span class="muted">' + esc(t('s_' + b.stage)) + '</span></span><span class="ck">' + (y ? '✔' : '') + '</span></button>'; }).join('') : '<p class="empty">' + esc(t('noResult')) + '</p>') + '</div>';
}
function bindAtt() {
  $('#attDay').onchange = (e) => { attDay = e.target.value || lastSunday(); render(); };
  document.querySelectorAll('[data-att]').forEach((el) => el.onclick = async () => {
    const id = el.dataset.att, on = !el.classList.contains('y');
    el.classList.toggle('y', on); el.querySelector('.ck').textContent = on ? '✔' : '';
    try { await setDoc(doc(db, 'attendance', attDay), { ids: on ? arrayUnion(id) : arrayRemove(id), updatedAt: serverTimestamp(), by: me.uid }, { merge: true }); }
    catch (e) { onErr(e); render(); }
  });
}

/* ---------- more ---------- */
function viewMore() {
  const admin = meDoc.role === 'admin';
  const list = [...staff.values()].sort((a, b) => (b.active - a.active) || a.name.localeCompare(b.name));
  let h = '<h2>' + esc(t('moreTitle')) + '</h2><div class="card" style="display:grid;gap:10px"><b>' + esc(t('me')) + '</b>' +
    '<label class="f">' + esc(t('myName')) + '<input class="i" id="myName" maxlength="40" value="' + esc(meDoc.name) + '"></label>' +
    '<button class="btn ghost" id="renameBtn">' + esc(t('rename')) + '</button><p class="muted" style="margin:0">' + esc(me.email || '') + (admin ? ' · ' + esc(t('admin')) : '') + '</p>' +
    '<button class="btn ghost" id="soBtn">' + esc(t('signout')) + '</button></div>';
  h += '<div class="card"><b>' + esc(t('staffList')) + ' · ' + list.filter((s) => s.active).length + '</b>' + list.map((s) => '<div class="item" style="cursor:default"><span class="ava">' + initial(s.name) + '</span><div class="t"><div class="n">' + esc(s.name) +
    (s.role === 'admin' ? ' <span class="chip">' + esc(t('admin')) + '</span>' : '') + (!s.active ? ' <span class="tag">' + esc(t('inactive')) + '</span>' : '') + '</div></div>' +
    (admin && s.id !== me.uid ? '<button class="btn small ' + (s.active ? 'warn' : 'ghost') + '" data-act="' + esc(s.id) + '" data-on="' + (s.active ? '0' : '1') + '">' + esc(s.active ? t('deactivate') : t('activate')) + '</button>' : '') + '</div>').join('') + '</div>';
  if (admin) {
    h += '<div class="card" style="display:grid;gap:10px"><b>' + esc(t('inviteTitle')) + '</b><p class="muted" style="margin:0">' + esc(t('inviteSub')) + '</p>' +
      '<button class="btn ghost" id="invBtn">' + esc(t('inviteNew')) + '</button><p id="invOut" style="font-size:22px;font-weight:800;letter-spacing:3px;margin:0"></p></div>' +
      '<div class="card"><button class="btn wide" id="csvBtn">' + esc(t('exportCsv')) + '</button></div>';
  }

}
function bindMore() {
  $('#soBtn').onclick = () => { location.hash = '#home'; signOut(auth); };
  $('#renameBtn').onclick = async () => { const n = $('#myName').value.trim(); if (!n) return toast(t('needName')); try { await updateDoc(doc(db, 'staff', me.uid), { name: n }); toast(t('saved')); } catch (e) { onErr(e); } };
  document.querySelectorAll('[data-act]').forEach((el) => el.onclick = async () => { try { await updateDoc(doc(db, 'staff', el.dataset.act), { active: el.dataset.on === '1' }); } catch (e) { onErr(e); } });
  if ($('#invBtn')) $('#invBtn').onclick = async () => {
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = crypto.getRandomValues(new Uint32Array(8));
    const code = [...r].map((x) => A[x % A.length]).join('');
    try { await setDoc(doc(db, 'config', 'invite'), { code, updatedAt: serverTimestamp() }); $('#invOut').textContent = t('inviteShown', { c: code }); } catch (e) { onErr(e); }
  };
  if ($('#csvBtn')) $('#csvBtn').onclick = exportCsv;
}
function exportCsv() {
  const cols = ['name', 'gender', 'age', 'phone', 'line', 'area', 'firstVisit', 'invitedBy', 'faith', 'family', 'prayer', 'memo'];
  const head = [...cols.map((c) => t(c)), t('stage'), t('caretaker'), t('lastContact'), t('next'), t('due'), t('clsTitle'), t('tabAtt')];
  const cell = (x) => '"' + String(x ?? '').replace(/"/g, '""') + '"';
  const rows = [...bests.values()].sort((a, b) => (a.firstVisit || '').localeCompare(b.firstVisit || '')).map((b) => [
    ...cols.map((c) => c === 'gender' && b.gender ? t('g_' + b.gender) : c === 'age' && b.age ? t('a_' + b.age) : c === 'faith' && b.faith ? t('f_' + b.faith) : b[c]),
    t('s_' + b.stage), careName(b.caretaker), b.lastContact, b.nextAction, b.nextDue, (b.cls || []).filter(Boolean).length + '/5',
    attendance.filter((a) => a.ids.has(b.id)).length]);
  const csv = '﻿' + [head, ...rows].map((r) => r.map(cell).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'BEST-' + today() + '.csv'; document.body.appendChild(a); a.click(); a.remove();
}
